[package]
name = "mete"
version = "0.1.2"
edition = "2021"
description = "Structural metrics engine for code quality analysis"
license = "MIT"
repository = "https://github.com/dutch-casa/mete.rs"
homepage = "https://github.com/dutch-casa/mete.rs"
keywords = ["metrics", "complexity", "analysis", "code-quality", "cyclomatic"]
categories = ["development-tools", "command-line-utilities"]
readme = "README.md"

[[bin]]
name = "mete"
path = "src/main.rs"

[lib]
name = "mete"
path = "src/lib.rs"

[features]
default = []
mcp = ["rmcp", "tokio", "schemars", "tracing", "tracing-subscriber", "anyhow"]

[dependencies]
clap = { version = "4.4", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
glob = "0.3"
colored = "2.1"
tree-sitter = "0.24.0"
tree-sitter-rust = "0.23.0"
tree-sitter-typescript = "0.23.0"
tree-sitter-python = "0.23.0"
tree-sitter-go = "0.23.0"
tree-sitter-java = "0.23.0"
tree-sitter-c-sharp = "0.23.0"
tree-sitter-javascript = "0.23.0"
tree-sitter-cpp = "0.23.0"
tree-sitter-elixir = "0.3.4"
rayon = "1.10"

# MCP server dependencies (optional)
rmcp = { version = "0.1", features = ["server", "transport-io", "macros"], optional = true }
tokio = { version = "1", features = ["full"], optional = true }
schemars = { version = "0.8", optional = true }
tracing = { version = "0.1", optional = true }
tracing-subscriber = { version = "0.3", features = ["env-filter"], optional = true }
anyhow = { version = "1.0", optional = true }

[dev-dependencies]
tempfile = "3"
